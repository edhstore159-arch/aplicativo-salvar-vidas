services:
  # ---------- BACKEND (FastAPI + MongoDB) ----------
  - type: web
    name: servivizinhos-backend
    runtime: python
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: servivizinhos
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # ---------- FRONTEND (React build estático) ----------
  - type: web
    name: servivizinhos-frontend
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"
      - key: REACT_APP_BACKEND_URL
        value: https://servivizinhos-backend.onrender.com
